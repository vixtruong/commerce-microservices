syntax = "proto3";

option csharp_namespace = "Catalog.Contracts.Grpc.Products";

package catalog.products.v1;

import "catalog/products/product_messages.proto";

service CatalogInternalGrpc {
  rpc GetProduct(GetProductRequest) returns (ProductReply);
  rpc GetProducts(GetProductsRequest) returns (GetProductsReply);
}
