global:
  scrape_interval: 10s

scrape_configs:
  - job_name: commerce-otel
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
